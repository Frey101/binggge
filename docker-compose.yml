services:
  api:
    build: ./api
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASS:-binggge}@db:5432/binggge
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binggge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-binggge}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: